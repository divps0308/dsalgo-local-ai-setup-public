name: dsalgo-local-ai-setup
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports: ["${OPEN_WEBUI_PORT:-3000}:8080"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENAI_API_BASE_URL: http://local-agent-gateway:8000/v1
      OPENAI_API_KEY: ${AGENT_API_KEY}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
      TZ: ${TZ:-Etc/UTC}
    volumes: ["open-webui-data:/app/backend/data"]
    depends_on:
      local-agent-gateway: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [local-ai]
    mem_limit: 3g

  local-agent-gateway:
    build: ./agent-gateway
    container_name: local-agent-gateway
    restart: unless-stopped
    ports: ["${AGENT_GATEWAY_PORT:-8001}:8000"]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-10}
      AGENT_ALLOW_WRITES: ${AGENT_ALLOW_WRITES:-true}
      AGENT_CONFIG_FILE: /config/agents.json
      RUNTIME_POLICY_FILE: /config/runtime-policy.json
      MODEL_REGISTRY_FILE: /config/models.json
      AGENT_SECRET_FILE: /runtime/secrets.json
      OAUTH_BROKER_URL: http://host.docker.internal:${OAUTH_BROKER_PORT:-3003}
      OAUTH_BROKER_TOKEN_FILE: /runtime/oauth-broker/token
      AGENT_WORKSPACE: /workspace
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./config:/config:ro
      - ./runtime:/runtime:ro
      - ./workspace:/workspace
      - ./logs:/logs
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [local-ai]
    mem_limit: 2g

  agent-studio:
    build: ./agent-studio
    container_name: local-agent-studio
    restart: unless-stopped
    ports: ["${AGENT_STUDIO_PORT:-3001}:8080"]
    environment:
      AGENT_CONFIG_FILE: /config/agents.json
      RUNTIME_POLICY_FILE: /config/runtime-policy.json
      MODEL_REGISTRY_FILE: /config/models.json
      GATEWAY_URL: http://local-agent-gateway:8000
      AGENT_API_KEY: ${AGENT_API_KEY}
      OAUTH_BROKER_URL: http://host.docker.internal:${OAUTH_BROKER_PORT:-3003}
      OAUTH_BROKER_TOKEN_FILE: /runtime/oauth-broker/token
    volumes:
      - ./config:/config
      - ./runtime:/runtime:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      local-agent-gateway: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [local-ai]
    mem_limit: 1g

networks: {local-ai: {driver: bridge}}
volumes:
  open-webui-data:
