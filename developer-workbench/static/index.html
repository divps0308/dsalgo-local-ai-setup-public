<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico?v=20260726-1" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=20260726-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="workbench-token" content="__TOKEN__" />
    <script>
      (() => {
        const mode = localStorage.getItem("dsalgo-local-ai-theme") || "system";
        const resolved = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
    <title>Developer Workbench</title>
    <script type="module" crossorigin src="/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app.css">
  </head>
  <body><div id="app"></div></body>
</html>
