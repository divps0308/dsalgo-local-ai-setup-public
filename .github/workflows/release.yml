name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected release tag to build (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # The environment protection rules are the primary gate. Keep this actor
    # check as a second, explicit owner-only guard.
    if: github.actor == 'divps0308'
    environment: release
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match v<major>.<minor>.<patch>: $env:RELEASE_TAG"
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Import protected signing certificate, build, and clean up
        shell: pwsh
        env:
          SIGNING_CERT_PFX_B64: ${{ secrets.SIGNING_CERT_PFX_B64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PFX_B64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw 'Protected release signing secrets are missing from the release environment.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dsalgo-release-signing.pfx'
          $thumbprint = $null
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_B64))
            $password = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation 'Cert:\CurrentUser\My'
            if (-not $cert -or -not $cert.HasPrivateKey) { throw 'The protected PFX does not contain a private signing key.' }
            if ($cert.Subject -ne 'CN=DSAlgo Local AI Setup Local Release Signing') {
              throw "Unexpected signing certificate subject: $($cert.Subject)"
            }
            $thumbprint = $cert.Thumbprint
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build\build.ps1
            if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE." }
          }
          finally {
            if ($thumbprint) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Variable password -ErrorAction SilentlyContinue
          }

      - name: Package complete release bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $bundlePath = Join-Path $PWD "dist\DSAlgo-Local-AI-Setup-$env:RELEASE_TAG.zip"
          Remove-Item -LiteralPath $bundlePath -Force -ErrorAction SilentlyContinue
          $entries = @(Get-ChildItem -LiteralPath .\dist -Force | Where-Object { $_.FullName -ne $bundlePath })
          if ($entries.Count -eq 0) { throw 'The release dist directory is empty.' }
          Compress-Archive -Path $entries.FullName -DestinationPath $bundlePath -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $bundlePath)) { throw 'The complete release bundle was not created.' }

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: dsalgo-local-ai-setup-${{ inputs.tag }}
          path: dist/DSAlgo-Local-AI-Setup-${{ inputs.tag }}.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: DSAlgo Local AI Setup ${{ inputs.tag }}
          generate_release_notes: true
          files: dist/DSAlgo-Local-AI-Setup-${{ inputs.tag }}.zip
